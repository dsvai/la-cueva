<title>La Cueva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* ===== Sistema de diseño de La Cueva =====
   Concepto: la oficina pixel art ocupa toda la pantalla (la "cueva");
   la interfaz son hojas de papel beige con tinta marrón y acentos verde bosque. */
:root{
  /* marca */
  --forest:#344C3D; --beige:#EFE5D5; --brown:#3D3028; --sand:#B29A7D;
  /* derivados */
  --cave:#1e1712; --cave-2:#2a211b; --forest-d:#283b2f; --forest-l:#4c6b57; --sand-l:#cbb79a; --sand-d:#8f785d;
  --paper:#f5eee2; --paper-2:#ece2d1; --paper-3:#dfd2bc; --ink:#3D3028; --ink-2:#6a594b; --ink-3:#8b7a6b; --line:rgba(61,48,40,.15); --line-2:rgba(61,48,40,.28);
  /* semánticos (estados reales) */
  --ok:#3f7d4f; --ok-bg:#dcebd8; --warn:#9a6a12; --warn-bg:#f3e3bd; --bad:#a3442f; --bad-bg:#f2d6cc; --info:#3f6a8a; --info-bg:#d7e4ee; --wait:#7a4f98; --wait-bg:#e8dcf0;
  /* tipografía */
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-pixel:"Pixelify Sans","Courier New",monospace;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --t-xs:12px; --t-s:13.5px; --t-m:15.5px; --t-l:18px; --t-xl:23px; --t-2xl:30px;
  /* espacio, radios, sombras */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:6px; --r2:10px; --r3:16px;
  --sh1:0 1px 0 rgba(61,48,40,.08),0 2px 8px rgba(30,23,18,.12); --sh2:0 18px 50px rgba(15,10,6,.45);
  --hdr:58px; --app-height:100vh; --viewport-top:0px; --viewport-bottom:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cave);color:var(--ink);font:var(--t-m)/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--beige);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #e2b35a;outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;color:var(--forest-d)}
a{color:var(--forest)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== cabecera ===== */
#top{position:fixed;top:calc(var(--viewport-top) + env(safe-area-inset-top,0px));left:0;right:0;height:var(--hdr);z-index:50;display:flex;align-items:center;gap:var(--s3);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--beige);color:var(--brown);border-bottom:3px solid var(--forest);box-shadow:0 2px 10px rgba(15,10,6,.35)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand img{height:38px;width:auto;display:block}
.wordmark{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:19px;line-height:1;white-space:nowrap}
.wordmark small{display:block;font-family:var(--f-body);font-weight:500;font-size:10.5px;letter-spacing:.2em;color:var(--sand-l);margin-top:3px;text-transform:uppercase}
nav.main{display:flex;gap:2px;margin-left:var(--s4);overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.main::-webkit-scrollbar{display:none}
.nb{position:relative;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--brown);padding:8px 11px;border-radius:var(--r1);font-weight:600;font-size:var(--t-s);white-space:nowrap;opacity:.88}
.nb:hover{background:rgba(61,48,40,.08);opacity:1}
.nb[aria-pressed=true]{background:var(--forest);color:var(--beige);opacity:1}
.nb svg{width:17px;height:17px;flex-shrink:0}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#b9532f;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge:empty{display:none}
.sysline{display:flex;gap:6px;align-items:center;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(61,48,40,.08);color:var(--brown);white-space:nowrap;border:0}
.pill i{width:7px;height:7px;border-radius:50%;background:#3f7d4f;display:inline-block}
.pill.warn i{background:#e0a941}.pill.bad i{background:#d0614a}

/* ===== escenario ===== */
#stage{position:fixed;top:calc(var(--viewport-top) + var(--hdr) + env(safe-area-inset-top,0px));left:0;right:0;height:calc(var(--app-height) - var(--hdr) - env(safe-area-inset-top,0px));overflow:hidden}
#world{width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}
#world[data-renderer=webgl]{image-rendering:auto}
.studio-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.studio-person{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;min-height:26px;padding:3px 8px;border:1px solid rgba(61,48,40,.2);border-radius:5px;background:rgba(245,238,226,.96);color:var(--forest-d);font:600 11px/1.2 var(--f-body);white-space:nowrap;pointer-events:auto;box-shadow:0 2px 8px rgba(49,40,27,.12)}
.studio-person i{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.studio-person[hidden]{display:none!important}
.studio-person{max-width:180px}.studio-person>span{overflow:hidden;text-overflow:ellipsis}
.studio-person:hover,.studio-person.selected{background:var(--forest);color:var(--beige);border-color:var(--forest)}
.studio-person.me{pointer-events:none;background:var(--brown);color:var(--beige)}
.studio-caption{position:absolute;left:24px;bottom:24px;display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:rgba(245,238,226,.9);border:1px solid var(--line);border-radius:6px;pointer-events:none;color:var(--ink-2);z-index:1;font-size:11px;line-height:1.4}
.studio-caption strong{font-family:var(--f-display);letter-spacing:.15em;color:var(--forest);font-size:12px}
.studio-error{pointer-events:auto;border-color:var(--bad)}
@media(max-width:699px){.studio-caption{left:14px;bottom:155px;padding:7px 10px}.studio-caption span{max-width:150px}.studio-person{min-height:32px;padding:5px 8px}}
.hud{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
.hb{width:40px;height:40px;border-radius:var(--r1);border:1px solid rgba(0,0,0,.45);background:rgba(42,33,27,.88);color:var(--beige);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.hb:hover{background:var(--forest)}
.hb svg{width:18px;height:18px}
#tip{position:absolute;pointer-events:none;z-index:6;background:rgba(30,23,18,.94);color:var(--beige);border:1px solid rgba(178,154,125,.35);border-radius:var(--r1);padding:6px 9px;font-size:var(--t-xs);max-width:240px}
#tip b{font-family:var(--f-display);font-size:var(--t-s)}
/* tarjeta de trabajador seleccionado */
#sel{position:absolute;z-index:7;width:290px;max-width:calc(100vw - 32px);background:var(--paper);border-radius:var(--r2);box-shadow:var(--sh2);border:1px solid var(--line-2);padding:var(--s3)}
#sel .row{display:flex;gap:var(--s3);align-items:center}
#sel h3{font-size:var(--t-l)}
#sel .role{color:var(--ink-2);font-size:var(--t-s)}
#sel .now{margin:var(--s3) 0;font-size:var(--t-s);background:var(--paper-2);border-radius:var(--r1);padding:7px 9px}
#sel .acts{display:flex;gap:6px;flex-wrap:wrap}
.x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:var(--r1);background:transparent;color:var(--ink-2);font-size:20px;line-height:1}
.x:hover{background:var(--paper-2)}
.av{image-rendering:pixelated;border-radius:var(--r1);flex-shrink:0;background:var(--forest-l);display:block}
.av{image-rendering:auto}
/* Joystick: pointer capture keeps movement stable when the finger leaves the base. */
#pad{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:112px;height:132px;z-index:5;display:none;user-select:none;-webkit-user-select:none}
#joystick{display:grid;place-items:center;width:112px;height:112px;padding:0;border:1px solid rgba(239,229,213,.65);border-radius:50%;background:rgba(52,76,61,.18);box-shadow:inset 0 0 0 13px rgba(239,229,213,.16),0 2px 12px rgba(41,54,46,.12);touch-action:none;-webkit-tap-highlight-color:transparent}
#joystick-knob{display:block;width:48px;height:48px;border-radius:50%;background:var(--forest);border:1px solid rgba(239,229,213,.8);box-shadow:0 3px 8px rgba(30,23,18,.22);pointer-events:none}
#joystick.active{background:rgba(52,76,61,.28)}
.joystick-hint{display:block;text-align:center;color:var(--forest-d);font-size:10px;font-weight:600;line-height:20px;letter-spacing:.06em;text-transform:uppercase}
@media (pointer:coarse),(max-width:760px),(max-height:500px) and (max-width:1000px){#pad{display:block}}

/* ===== botones ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r1);padding:8px 13px;font-weight:600;font-size:var(--t-s);background:var(--forest);color:var(--beige);white-space:nowrap;min-height:36px}
.btn:hover{background:var(--forest-d)}
.btn.sec{background:transparent;color:var(--forest-d);border-color:var(--line-2)}
.btn.sec:hover{background:var(--paper-2)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 9px;min-height:30px;font-size:var(--t-xs)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ===== chips de estado (forma + texto, nunca solo color) ===== */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper-3);color:var(--ink);white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.wait{background:var(--wait-bg);color:var(--wait)} .chip.plain::before{display:none}
.st-idle{color:var(--ok)} .st-working{color:var(--warn)} .st-collab{color:var(--info)} .st-waiting{color:var(--wait)} .st-stopped{color:var(--bad)}

/* ===== cajones laterales (directorio y chat) ===== */
.drawer{position:fixed;top:calc(var(--viewport-top) + var(--hdr) + env(safe-area-inset-top,0px));height:calc(var(--app-height) - var(--hdr) - env(safe-area-inset-top,0px));z-index:30;background:var(--paper);box-shadow:var(--sh2);display:flex;flex-direction:column;transition:transform .22s ease;overflow:hidden}
#dir{left:0;width:330px;max-width:100vw;transform:translateX(-102%);padding-left:env(safe-area-inset-left,0px)}
#dir.open{transform:none}
#chat{right:0;width:440px;max-width:100vw;transform:translateX(102%);padding-right:env(safe-area-inset-right,0px)}
#chat.open{transform:none}
#chat.wide{width:min(1180px,100vw)}
.dhead{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-shrink:0;min-height:58px}
.dhead h2{font-size:var(--t-l);flex:1}
.dhead .x{position:static;flex-shrink:0}
.dbody{flex:1;overflow:auto;padding:var(--s3) var(--s4) var(--s5)}
.search{width:100%;border:1px solid var(--line-2);background:#fffaf2;border-radius:var(--r1);padding:9px 11px;font-size:var(--t-s)}
.dept{margin-top:var(--s4)}
.dept h4{font-family:var(--f-pixel);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dept h4 button{margin-left:auto}
.dept h4 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.agent-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:var(--r1)}
.agent-row:hover{background:var(--paper-2)}
.agent-row .nm{font-weight:700;font-size:var(--t-s);display:block}
.agent-row .rl{color:var(--ink-2);font-size:var(--t-xs);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-row .mid{flex:1;min-width:0}
.roster-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px;font-size:var(--t-s)}
.roster-tools select{padding:6px 8px;min-width:0;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--paper)}
.agent-entry{display:flex;align-items:center;gap:4px;border-radius:var(--r1);margin:3px 0}
.agent-entry .agent-row{flex:1;min-width:0;width:auto}
.agent-entry>.btn{flex-shrink:0;font-size:11px;padding:7px 8px;min-height:36px}
.agent-entry.inactive{background:var(--paper-2)}
.agent-entry.inactive .av{filter:grayscale(.65);opacity:.65}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ===== chat ===== */
.chat-wrap{flex:1;display:flex;min-height:0}
.convs{width:280px;border-right:1px solid var(--line);overflow:auto;padding:var(--s3);display:none;flex-shrink:0;background:var(--paper-2)}
#chat.wide .convs{display:block}
.convs h4{font-family:var(--f-pixel);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:var(--s3) 0 4px}
.conv-item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r1);padding:7px 9px;font-size:var(--t-s)}
.conv-item:hover{background:var(--paper-3)} .conv-item[aria-current=true]{background:var(--paper);box-shadow:var(--sh1)}
.conv-item small{display:block;color:var(--ink-3);font-size:var(--t-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-bar{display:flex;gap:6px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chat-bar select{border:1px solid var(--line-2);border-radius:var(--r1);background:#fffaf2;padding:5px 8px;font-size:var(--t-xs);max-width:100%}
.side{width:300px;border-left:1px solid var(--line);overflow:auto;padding:var(--s3) var(--s4);display:none;flex-shrink:0}
#chat.wide .side{display:block}
.msgs{flex:1;overflow:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.msg{max-width:92%;display:flex;flex-direction:column;gap:4px}
.msg.user{align-self:flex-end}
.msg .bub{padding:10px 13px;border-radius:14px;font-size:var(--t-m);line-height:1.55;overflow-wrap:anywhere}
.msg.user .bub{background:var(--forest);color:var(--beige);border-bottom-right-radius:4px}
.msg.assistant .bub{background:#fffaf2;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.system .bub{background:var(--warn-bg);border:1px solid rgba(154,106,18,.25);font-size:var(--t-s)}
.msg .meta{font-size:var(--t-xs);color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg.user .meta{justify-content:flex-end}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--ink-2);font-size:var(--t-s)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sand-d);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}.drawer{transition:none}}
.md p{margin:0 0 .6em}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{margin:.8em 0 .35em;color:var(--forest-d)}.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4{font-size:1em}
.md ul,.md ol{margin:0 0 .6em;padding-left:1.3em}.md li{margin:.15em 0}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--paper-2);padding:1px 5px;border-radius:4px}
.md pre{position:relative;background:#231c17;color:#efe5d5;border-radius:var(--r1);padding:12px;overflow:auto;font-size:12.5px;line-height:1.5;margin:.5em 0}
.md pre code{background:none;padding:0;color:inherit;font-size:inherit}
.md pre .cp{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 7px;border-radius:5px;border:1px solid rgba(239,229,213,.25);background:rgba(239,229,213,.08);color:var(--beige)}
.md blockquote{margin:.5em 0;padding:.2em .9em;border-left:3px solid var(--sand);color:var(--ink-2)}
.md table{border-collapse:collapse;font-size:.92em;margin:.5em 0;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line-2);padding:5px 8px;text-align:left;vertical-align:top}.md th{background:var(--paper-2)}
.md hr{border:0;border-top:1px solid var(--line-2);margin:1em 0}
.tools{border:1px dashed var(--line-2);border-radius:var(--r1);font-size:var(--t-xs);background:var(--paper-2)}
.tools summary{cursor:pointer;padding:5px 9px;font-weight:600;color:var(--ink-2)}
.tools .ti{padding:5px 9px;border-top:1px solid var(--line)}
.tools code{font-family:var(--f-mono);font-size:11px;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.atts{display:flex;gap:6px;flex-wrap:wrap}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fffaf2;border-radius:var(--r1);padding:4px 8px;font-size:var(--t-xs);max-width:220px}
.msg.user .att{background:rgba(255,255,255,.12);border-color:rgba(239,229,213,.3);color:var(--beige)}
.att img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{border-top:1px solid var(--line);padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.composer .row{display:flex;gap:6px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line-2);border-radius:var(--r2);padding:10px 12px;background:#fffaf2;min-height:46px;max-height:200px;font-size:var(--t-m);line-height:1.45}
.composer,.chat-bar{flex-shrink:0}
.msgs,.dbody,.chat-main{min-height:0}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 10px;font-size:var(--t-xs);color:var(--forest-d)}
.sugg button:hover{background:var(--paper-2)}
.hint{font-size:var(--t-xs);color:var(--ink-3)}
/* tarjeta de plan dentro del chat */
.plan{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--paper);overflow:hidden}
.plan header{padding:9px 12px;background:var(--paper-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan header b{font-family:var(--f-display);font-size:var(--t-m);flex:1;min-width:150px}
.plan .tk{display:flex;gap:9px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:var(--t-s)}
.plan .tk .t{flex:1;min-width:0}
.plan .tk .t small{display:block;color:var(--ink-3);font-size:var(--t-xs)}
.plan .tk.child{padding-left:30px;background:rgba(223,210,188,.25)}
.plan footer{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ===== paneles (modales) ===== */
