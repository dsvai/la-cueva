<header id="top">
  <div class="brand" id="brand" title="La Cueva by Daniel"><img id="logo" alt="La Cueva by Daniel"></div>
  <nav class="main" aria-label="Secciones">
    <button class="nb" data-open="dir" aria-pressed="false"><svg><use href="#i-dir"/></svg><span class="lb">Directorio</span></button>
    <button class="nb" data-panel="projects" aria-pressed="false"><svg><use href="#i-proj"/></svg><span class="lb">Proyectos</span></button>
    <button class="nb" data-panel="control" aria-pressed="false"><svg><use href="#i-ctl"/></svg><span class="lb">Dirección</span><span class="badge" id="b-attn"></span></button>
    <button class="nb" data-panel="approvals" aria-pressed="false"><svg><use href="#i-ok"/></svg><span class="lb">Aprobaciones</span><span class="badge" id="b-appr"></span></button>
    <button class="nb" data-panel="memory" aria-pressed="false"><svg><use href="#i-mem"/></svg><span class="lb">Memoria</span><span class="badge" id="b-mem"></span></button>
    <button class="nb" data-panel="integrations" aria-pressed="false"><svg><use href="#i-int"/></svg><span class="lb">Integraciones</span></button>
    <button class="nb" data-panel="status" aria-pressed="false"><svg><use href="#i-info"/></svg><span class="lb">Estado</span></button>
    <button class="nb" data-panel="settings" aria-pressed="false"><svg><use href="#i-set"/></svg><span class="lb">Ajustes</span></button>
  </nav>
  <div class="sysline">
    <button class="pill" id="p-ai" data-panel="status"><i></i><span>IA</span></button>
    <button class="pill" id="p-db" data-panel="status"><i></i><span>Datos</span></button>
  </div>
</header>

<main id="stage">
  <canvas id="world" aria-label="Oficina de La Cueva. Usa el joystick en móvil o WASD y las flechas con teclado; toca a un trabajador para hablar con él." tabindex="0"></canvas>
  <div class="hud">
    <button class="hb" id="z-in" aria-label="Acercar"><svg><use href="#i-plus"/></svg></button>
    <button class="hb" id="z-out" aria-label="Alejar"><svg><use href="#i-minus"/></svg></button>
    <button class="hb" id="z-all" aria-label="Ver toda la oficina"><svg><use href="#i-map"/></svg></button>
    <button class="hb" id="z-me" aria-label="Centrar en mi personaje"><svg><use href="#i-me"/></svg></button>
  </div>
  <div id="tip" hidden></div>
  <div id="sel" hidden></div>
  <div id="pad">
    <button id="joystick" type="button" aria-label="Joystick de movimiento. Arrastra en la dirección deseada; con teclado usa WASD o las flechas."><span id="joystick-knob" aria-hidden="true"></span></button>
    <span class="joystick-hint" aria-hidden="true">Mover</span>
  </div>
</main>

<aside id="dir" class="drawer" aria-label="Directorio">
  <div class="dhead"><h2>Directorio</h2><button class="btn sm sec" id="new-agent"><svg><use href="#i-plus"/></svg>Nuevo agente</button><button class="x" data-close="dir" aria-label="Cerrar">×</button></div>
  <div class="dbody"><input class="search" id="dir-q" type="search" placeholder="Buscar por nombre, cargo o especialidad" aria-label="Buscar en el directorio"><div class="roster-tools"><strong id="dir-count" aria-live="polite"></strong><select id="dir-status" aria-label="Filtrar agentes por estado"><option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Desactivados</option></select></div><p class="hint">Puedes activar o desactivar cada agente. Sus conversaciones, instrucciones y documentos se conservan.</p><div id="dir-list"></div></div>
</aside>

<aside id="chat" class="drawer" aria-label="Chat"></aside>

<button id="fab" aria-label="Hablar con Daniel, director general"><canvas id="fab-av" width="36" height="36"></canvas><span class="lbl">Daniel<small>Director general</small></span></button>

<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
